<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento Hotel</title>
    <link rel="stylesheet" href="./style.css"> 
</head>
<body style="margin: 0; font-family: sans-serif;">

    <div id="app"></div>

    <div id="error-overlay" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000;">
        <h1>⚠️ Error Crítico de la Aplicación</h1>
        <pre id="errlog" style="white-space: pre-wrap; word-wrap: break-word; max-width: 80%; padding: 20px; background-color: #333; border: 1px solid red;"></pre>
        <button id="reload-btn" style="padding: 10px 20px; margin-top: 20px; cursor: pointer;">Recargar</button>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
