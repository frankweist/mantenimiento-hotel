<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mantenimiento Hotel · Residences</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./styles.css" />
  <meta name="theme-color" content="#0a4077">
</head>
<body>
  <div id="app"></div>
  <div id="modal" class="hidden modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button id="modal-close" class="btn">✕</button>
      </div>
      <div id="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn">Cancelar</button>
        <button id="modal-ok" class="btn-primary">Guardar</button>
      </div>
    </div>
  </div>
  <div id="error-overlay" class="hidden">
    <h3>La app ha fallado</h3>
    <pre id="errlog">(sin detalles)</pre>
    <button id="reload-btn">Recargar</button>
  </div>
  <script src="./app.js?v=1.4.2-fix2"></script>
</body>
</html>
