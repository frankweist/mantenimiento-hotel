<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento Hotel</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div id="app"></div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close" class="btn-icon">&times;</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div class="modal-footer">
                <button id="modal-cancel" class="btn">Cancelar</button>
                <button id="modal-ok" class="btn-primary">Aceptar</button>
            </div>
        </div>
    </div>
    
    <div id="error-overlay" class="error-overlay hidden">
        <h2>Error en la aplicación</h2>
        <pre id="errlog"></pre>
        <button id="reload-btn" class="btn">Recargar</button>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
