<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mantenimiento Hotel · Residences</title>
  <meta name="theme-color" content="#0a4077">
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:#f8fafc;color:#0f172a}
    #app{min-height:100vh}
    #boot-msg{position:fixed;left:12px;bottom:12px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;font-size:13px;color:#334155;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    #error-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.95);color:#111;padding:18px;overflow:auto;z-index:9999}
    #error-overlay pre{white-space:pre-wrap;background:#fee2e2;border:1px solid #ef4444;padding:10px;border-radius:8px}
    .btn{display:inline-block;margin-top:8px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer}
    .pill{border:1px solid #cbd5e1;border-radius:999px;padding:6px 10px;background:#fff;cursor:pointer}
    .pill.sel{background:#0a4077;color:#fff;border-color:#0a4077}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot-msg">Cargando app…</div>
  <div id="error-overlay">
    <h3>La app ha fallado al cargar</h3>
    <div>Prueba recargar con <b>Ctrl+F5</b>. Si sigue, puede ser bloqueo del CDN.</div>
    <pre id="errlog">(sin detalles)</pre>
    <button class="btn" onclick="location.reload()">Recargar</button>
  </div>
  <script type="module" src="./app.js?v=1.3.2"></script>
  <noscript>Necesitas activar JavaScript.</noscript>
</body>
</html>
